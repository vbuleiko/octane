{% from "_macros.html" import logo %}
<header class="site-nav">
  <a class="logo" href="{{ url_for('public.landing') }}">{{ logo() }} {{ config.APP_NAME }}</a>
  <nav>
    {% if session.tenant_id %}
      <a class="btn primary" href="{{ url_for('owner.stock_list') }}">Open app</a>
    {% else %}
      <a href="{{ url_for('public.login') }}">Log in</a>
      {% if not g.host %}<a class="btn primary" href="{{ url_for('public.signup') }}">Start free trial</a>{% endif %}
    {% endif %}
  </nav>
</header>
